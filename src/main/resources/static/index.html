<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Employee Payroll Management</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-container">

    <div class="login-box glass-card animated">
        <div class="mb-4">
            <i class="fas fa-id-card-clip fa-3x text-primary-custom mb-3"></i>
            <h2 class="fw-bold">PayrollPro</h2>
            <p class="text-secondary small mb-4">Select your portal to continue</p>
            
            <!-- Role Toggle -->
            <div class="btn-group w-100 mb-4" role="group">
                <input type="radio" class="btn-check" name="loginRole" id="roleEmployee" value="EMPLOYEE" checked>
                <label class="btn btn-outline-primary" for="roleEmployee"><i class="fas fa-user me-2"></i> Employee</label>

                <input type="radio" class="btn-check" name="loginRole" id="roleHR" value="ADMIN">
                <label class="btn btn-outline-primary" for="roleHR"><i class="fas fa-user-shield me-2"></i> HR Admin</label>
            </div>
        </div>

        <form id="loginForm">
            <div class="mb-3 text-start">
                <label for="email" class="form-label small fw-bold">Email Address</label>
                <input type="email" class="form-control" id="email" placeholder="name@company.com" required>
            </div>
            <div class="mb-3 text-start">
                <label for="password" class="form-label small fw-bold">Password</label>
                <div class="input-group">
                    <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
                    <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="rememberMe">
                    <label class="form-check-label small" for="rememberMe">Remember me</label>
                </div>
                <a href="#" class="small text-decoration-none">Forgot Password?</a>
            </div>
            <div id="googleSignInButton" class="mb-3" data-google-client-id="765816233561-1eea26caklcpnmh63iqla9601c2tm31s.apps.googleusercontent.com"></div>
            <button type="submit" class="btn btn-primary-custom w-100 py-2">
                Login <i class="fas fa-sign-in-alt ms-2"></i>
            </button>
        </form>

        <div id="loginError" class="alert alert-danger mt-3 d-none">
            Invalid credentials. Please try again.
        </div>

        <div class="mt-4 pt-3 border-top">
            <p class="small text-secondary mb-0">© 2026 PayrollPro HR Solutions</p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
