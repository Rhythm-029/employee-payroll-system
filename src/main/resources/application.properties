# ===================================================================
# DATABASE CONFIGURATION - SMART REACHABILITY MODE
# ===================================================================

# [DEFAULT] H2 Internal Database (Ensures "Site Reachable" instantly)
spring.datasource.url=jdbc:h2:mem:payrolldb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_UPPER=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# [SWITCH] MySQL Production (Uncomment to use your local MySQL)
# spring.datasource.url=jdbc:mysql://localhost:3306/payrolldb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=Yash
# spring.datasource.password=Yash@123

# ===================================================================
# SHARED SETTINGS
# ===================================================================

# Run schema.sql on startup (Includes the 42 seeded employees)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# H2 console (view DB at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Port Configuration
server.port=8080

# Disable mail (not needed for this demo)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration