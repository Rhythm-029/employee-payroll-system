spring.datasource.url=jdbc:h2:mem:payrolldb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_UPPER=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Mail settings for password reset. Update with a working SMTP account.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-email-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.from=no-reply@payrollpro.com

# Google client ID for Google Sign-In. Set this after creating credentials in Google Cloud Console.
google.client-id=765816233561-1eea26caklcpnmh63iqla9601c2tm31s.apps.googleusercontent.com

# Reset password page URL used in reset emails.
app.reset-password-url=http://localhost:8080/reset-password.html